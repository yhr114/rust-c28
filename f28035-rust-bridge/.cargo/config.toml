# .cargo/config.toml — Build configuration for C28x target.
#
# Usage:
#   powershell -File tools/verify-cargo-c28x-object.ps1

[target.c28x-none-elf]
# Generate C28x objects with patched rustc; invoke TI cl2000 separately for final linking.
rustflags = [
  "-C", "panic=abort",
  "-C", "relocation-model=static",
]
