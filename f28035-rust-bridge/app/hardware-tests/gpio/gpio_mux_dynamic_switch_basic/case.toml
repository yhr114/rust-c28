source_c = "fpga_delivery_28035/case_src/gpio/gpio_mux_dynamic_switch_basic/src/main.c"
verification = "F28035 JTAG RAM: SAFE_HAL_CASE_TARGET_TEST=PASS; GPIO0 MUX phase1=1(EPWM1A) phase2=0(GPIO)"
