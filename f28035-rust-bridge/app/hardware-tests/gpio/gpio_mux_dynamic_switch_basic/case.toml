# split into two linked mirror functions for mid-phase snapshot).  Reuses the
# gpio0-mux C harness, build script, RAM verify script and dss judge.
[mir_template]
app = "rust_gpio0_mux_to_epwm1a"
probe = "XDS100v1"
link = "RAM (SARAM, no flash)"
observed = "called=1 phase1_mux=1 phase2_mux=0 PASS"
