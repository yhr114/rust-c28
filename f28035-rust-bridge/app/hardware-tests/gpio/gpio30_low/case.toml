name = "gpio30_low"
category = "gpio"
entry = "src/main.rs"
status = "verified"
requires = ["gpio", "delay", "test-runtime"]
source_c = "fpga_delivery_28035/case_src/gpio/gpio30_low/src/main.c"
verification = "F28035 JTAG RAM: SAFE_HAL_CASE_TARGET_TEST=PASS; called=1 MUX=0 DIR=1 DATA=0"
safe_hal_status = "verified-via-mir"
safe_hal_verify = "tools/verify-safe-hal-case-ram.ps1 -Case gpio/gpio30_low"
build_route = "app registry -> crates/rust-api::rust_gpio30_low -> rustc MIR -> backend/c28x-mir -> TI CGT RAM link"

# P1 vertical template (rust-bridge side): the application body is Safe HAL
# code with no direct C ABI declarations and no unsafe block.  The Rust body
# configures GPIO30 as an output through a typed OutputPin handle and drives
# it low; the C harness (gpio30_low_test.c) snapshots MUX/DIR/DATA after the
# function returns, and the JTAG judge requires MUX=0, DIR=1, DATA=0.
# Verified through the true rustc -> c28x-mir -> TI assembler path over RAM
# (flash untouched).
[mir_template]
app = "rust_gpio30_low"
probe = "XDS100v1"
link = "RAM (SARAM, no flash)"
observed = "called=1 MUX=0 DIR=1 DATA=0 PASS"
hal = "rust-api (C-bridge exclusive pin mask == safe-hal used:u64)"
