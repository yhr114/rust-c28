name = "gpio_toggle_basic"
category = "gpio"
entry = "src/main.rs"
status = "verified"
requires = ["gpio", "delay", "test-runtime"]
source_c = "fpga_delivery_28035/case_src/gpio/gpio_toggle_basic/src/main.c"
verification = "F28035 JTAG RAM (2026-09-22): SAFE_HAL_CASE_TARGET_TEST=PASS; called=1 MUX=0 DIR=1 final=0 toggle=1,0"
safe_hal_status = "verified-via-mir"
safe_hal_verify = "tools/verify-safe-hal-case-ram.ps1 -Case gpio/gpio_toggle_basic"
build_route = "app registry -> crates/rust-api::rust_gpio34_toggle_basic -> rustc MIR -> backend/c28x-mir -> TI CGT RAM link"

# P1 vertical template #3 (rust-bridge side): the application body is Safe HAL
# code with no direct C ABI declarations and no unsafe block.  The Rust body
# starts GPIO34 low and toggles 8 (even) times so the final level is low; the C
# harness (gpio34_toggle_test.c) reads GPBDAT back (must be 0), then issues two
# TOGGLE commands of its own and records 1 then 0, proving the toggle path
# flips the pin.  Verified through the true rustc -> c28x-mir -> TI assembler
# path over RAM (flash untouched).
[mir_template]
app = "rust_gpio34_toggle_basic"
probe = "XDS100v1"
link = "RAM (SARAM, no flash)"
observed = "called=1 MUX=0 DIR=1 final=0 toggle_after_first=1 toggle_after_second=0 PASS"
hal = "rust-api (C-bridge exclusive pin mask == safe-hal used:u64)"
