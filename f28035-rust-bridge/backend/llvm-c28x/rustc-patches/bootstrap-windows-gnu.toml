linker = "D:/c28x-toolchain/rustup-gnu/toolchains/nightly-2026-09-14-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/bin/self-contained/x86_64-w64-mingw32-gcc.exe"
