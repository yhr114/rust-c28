# Local Windows GNU bootstrap used for the C28x stage1 rustc build.
profile = "compiler"
change-id = 999999

[build]
build-dir = "D:/c28x-toolchain/rust-build-gcc14fix"
build = "x86_64-pc-windows-gnu"
host = ["x86_64-pc-windows-gnu"]
target = ["x86_64-pc-windows-gnu"]
rustc = "D:/c28x-toolchain/rustup-gnu/toolchains/nightly-2026-09-14-x86_64-pc-windows-gnu/bin/rustc.exe"
cargo = "D:/c28x-toolchain/rustup-gnu/toolchains/nightly-2026-09-14-x86_64-pc-windows-gnu/bin/cargo.exe"
submodules = false
extended = false
docs = false

