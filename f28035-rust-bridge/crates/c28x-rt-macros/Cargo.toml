[package]
name = "c28x-rt-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for c28x-rt (#[entry], #[pre_init], #[interrupt])"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
