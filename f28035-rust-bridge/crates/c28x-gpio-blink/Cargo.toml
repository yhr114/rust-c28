[package]
name = "c28x-gpio-blink"
version = "0.1.0"
edition = "2021"
description = "F28035 GPIO34 toggle built with real cargo + patched rustc for the c28x-none-elf target"
license = "MIT OR Apache-2.0"

[[bin]]
name = "c28x-gpio-blink"
path = "src/main_interrupt_abi.rs"

[dependencies]
c28x-pac = { path = "../c28x-pac" }

[profile.dev]
debug-assertions = false
panic = "abort"

[profile.release]
debug-assertions = false
panic = "abort"
opt-level = "s"
