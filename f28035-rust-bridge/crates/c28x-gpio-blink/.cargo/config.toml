# cargo config for the c28x-gpio-blink no_std binary.
#
# Native -Zbuild-std flow: cargo builds core + compiler_builtins from the
# rust-src tree shipped in the patched rustc sysroot
#   (lib/rustlib/src/rust/library/{core,compiler-builtins})
#
# Two-rustc split via tools/rustc-wrapper.cmd:
#   - c28x-none-elf target artifacts -> patched C28x rustc
#   - host build scripts (x86_64-pc-windows-gnu) -> system MSVC rustc with
#     --target stripped (patched rustc's host std produces broken Windows
#     exes, STATUS_ENTRYPOINT_NOT_FOUND)
#   - -vV / sysroot probes -> patched rustc (so cargo picks its rust-src)
#
# The custom sysroot at build/c28x-sysroot is no longer referenced here; the
# old manual-build flow (tools/build-core-rlib.ps1, build-builtins-rlib.ps1,
# config.toml.bak-sysroot) is kept as a fallback.
#
# Required on the command line:
#   $env:RUSTC_BOOTSTRAP='1'
#   cargo build -Zbuild-std=core,compiler_builtins --release --target c28x-none-elf

[build]
target = "c28x-none-elf"
rustc = "D:\\c28x-toolchain\\rust-build-gcc14fix\\host\\stage1\\bin\\rustc.exe"
rustc-wrapper = "C:\\Users\\61987\\Desktop\\28035\\f28035-rust-bridge\\tools\\rustc-wrapper.exe"

[target.c28x-none-elf]
linker = "C:\\Users\\61987\\Desktop\\28035\\f28035-rust-bridge\\tools\\noop-link.cmd"
rustflags = [
    "-Crelocation-model=static",
    "-Cpanic=abort",
    "-Cdebug-assertions=no",
    "-Zforce-unstable-if-unmarked",
    "-Awarnings",
]
